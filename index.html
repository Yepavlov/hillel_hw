<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App MVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <script src="js/app.js" defer type="module"></script>
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4 text-center">Notes Manager</h1>

    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form id="noteForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <input type="text" id="noteTitle" class="form-control" placeholder="Note title (min 3 chars)"
                               autocomplete="off">
                    </div>
                    <div class="col-md-4">
                        <select id="noteCategory" class="form-select">
                            <option value="work">Work</option>
                            <option value="study">Study</option>
                            <option value="personal">Personal</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Add note</button>
                    </div>
                </div>
                <div id="errorMessage" class="text-danger mt-2 d-none"></div>
            </form>
        </div>
    </div>

    <div class="d-flex justify-content-end mb-3">
        <button id="clearAllBtn" class="btn btn-danger">Clear all</button>
    </div>

    <div id="notesList" class="row g-3"></div>
</div>
</body>
</html>
